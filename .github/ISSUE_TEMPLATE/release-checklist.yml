name: Release Checklist
description: Track a focused update from development through Store acceptance
title: "Release: "
labels: ["release"]
assignees: []

body:
  - type: input
    id: release
    attributes:
      label: Release title
      description: A short description of the update
      placeholder: Metadata and Markdown Import
    validations:
      required: true

  - type: textarea
    id: development
    attributes:
      label: Development
      value: |
        - [ ] Read RELEASE_CHECKLIST.md and start a focused branch from current main
        - [ ] Agree scope and link the issues this update resolves
        - [ ] Implement and test the changes
        - [ ] Run npm ci, tests, typecheck, lint and check-format
        - [ ] Run the distribution build, distribution integrity check and git diff --check
        - [ ] Test affected commands in Raycast with isolated synthetic data

  - type: textarea
    id: documentation
    attributes:
      label: Documentation and submission
      value: |
        - [ ] Update README, recovery guidance and roadmap where needed
        - [ ] Preserve published changelog history; add the new entry with {PR_MERGE_DATE}
        - [ ] Recheck current Raycast Store guidelines and API compatibility
        - [ ] Prepare a focused submission checkout; keep standalone maintenance files here
        - [ ] Verify screenshots and review the final diff
        - [ ] Submit only when authorized; keep the PR description short
        - [ ] Address review feedback and verify required checks

  - type: textarea
    id: postrelease
    attributes:
      label: After Store acceptance
      value: |
        - [ ] Verify the merge and Raycast publication report
        - [ ] Sync the personal repository with the accepted source and record provenance
        - [ ] Update release status and close verified completed issues
        - [ ] Assess whether a separate standalone tag/release is useful; create it only when authorized
        - [ ] Start subsequent development from current main
